name: '🐛 Bug report'
description: Report a reproducible bug or regression
body:
  - type: markdown
    attributes:
      value: |
        Report bugs in TanStack Workflow here. For questions and feature requests, use [Discussions](https://github.com/TanStack/workflow/discussions).
        Pull requests are limited to collaborators. You can still share a proposed fix or branch link in your report.
  - type: textarea
    id: workflow-versions
    attributes:
      label: Package versions
      description: List the exact versions of workflow-core, workflow-runtime, and any host or store adapters involved.
      placeholder: '@tanstack/workflow-runtime 0.0.3, @tanstack/workflow-store-drizzle-postgres 0.0.5'
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and deployment
      description: Include the Node.js or worker runtime version, hosting platform, and database if relevant.
      placeholder: Node.js 24, Lambda, Postgres 17
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior, actual behavior, and steps to reproduce it. For stuck runs, include the run status and relevant events with private data removed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Runnable reproduction
      description: Link a small repository or provide code and commands we can run. Include workflow definitions, store setup, and the signal, timer, restart, or deployment that triggers the bug. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed fix or branch link
      description: Optional. Share any investigation or fix you already have.
